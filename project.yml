name: GoalRush
options:
  bundleIdPrefix: org.xpetsllc
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 8USAFADYCA
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  GoalRush:
    type: application
    platform: iOS
    sources:
      - path: GoalRush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.xpetsllc.GoalRush
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Goal Rush
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    dependencies: []
  GoalRushTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GoalRushTests
    dependencies:
      - target: GoalRush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.xpetsllc.GoalRushTests
        GENERATE_INFOPLIST_FILE: YES
  GoalRushUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GoalRushUITests
    dependencies:
      - target: GoalRush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.xpetsllc.GoalRushUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GoalRush:
    build:
      targets:
        GoalRush: all
        GoalRushTests: [test]
        GoalRushUITests: [test]
    test:
      targets:
        - GoalRushTests
        - GoalRushUITests
