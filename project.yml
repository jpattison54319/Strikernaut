name: GoalRush
options:
  bundleIdPrefix: org.xpetsllc
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 8USAFADYCA
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.4.0
targets:
  GoalRush:
    type: application
    platform: iOS
    productName: Strikernaut
    info:
      path: GoalRush/Info.plist
      properties:
        CFBundleDisplayName: Strikernaut
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GADApplicationIdentifier: ca-app-pub-4420388555038160~5123048287
        GADRewardedAdUnitIdentifier: "$(ADMOB_REWARDED_AD_UNIT_ID)"
        ITSAppUsesNonExemptEncryption: false
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
