        UIAppFonts:
          - BarlowCondensed-BlackItalic.otf
          - BarlowCondensed-Bold.otf
          - BarlowSemiCondensed-SemiBold.otf
          - BarlowSemiCondensed-Medium.otf
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - path: GoalRush
        excludes:
          - Resources/ArtArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: iCloud.org.xpetsllc.GoalRush
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "29"
        PRODUCT_NAME: Strikernaut
        PRODUCT_MODULE_NAME: GoalRush
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ADMOB_REWARDED_AD_UNIT_ID: ca-app-pub-4420388555038160/3274211774
    dependencies:
      - package: GoogleMobileAds
  GoalRushTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GoalRushTests
    dependencies:
      - target: GoalRush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.xpetsllc.GoalRushTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Strikernaut.app/Strikernaut"
        BUNDLE_LOADER: "$(TEST_HOST)"
  GoalRushUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GoalRushUITests
    dependencies:
      - target: GoalRush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.xpetsllc.GoalRushUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GoalRush:
    build:
      targets:
        GoalRush: all
        GoalRushTests: [test]
        GoalRushUITests: [test]
    test:
      targets:
        - GoalRushTests
        - GoalRushUITests
