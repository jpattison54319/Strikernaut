  - main [ref=f1e9]:
    - article [ref=f1e10]:
      - generic [ref=f1e11]: EFFECTIVE JULY 29, 2026
      - heading "Privacy Policy" [level=1] [ref=f1e12]
      - paragraph [ref=f1e13]: Strikernaut is designed to work without an account. Your gameplay progress stays on your device. Optional rewarded advertisements are provided by Google and are the app’s only networked third-party service.
      - heading "Information stored on your device" [level=2] [ref=f1e14]
      - paragraph [ref=f1e15]: "Strikernaut stores the following information locally:"
      - list [ref=f1e16]:
        - listitem [ref=f1e17]: Campaign and Endless progress
        - listitem [ref=f1e18]: Training Tokens, upgrades, unlocks, achievements, and statistics
        - listitem [ref=f1e19]: Audio, haptic, and gameplay settings
        - listitem [ref=f1e20]: Current-run checkpoints used to resume an interrupted run
      - paragraph [ref=f1e21]:
        - text: This information is not transmitted to the developer. You can remove it with the in-app
        - strong [ref=f1e22]: Reset Account
        - text: action or by deleting the app.
      - heading "Optional rewarded advertisements" [level=2] [ref=f1e23]
      - paragraph [ref=f1e24]: Strikernaut uses Google Mobile Ads and Google’s User Messaging Platform to offer optional rewarded video ads and, where required, collect or manage advertising consent. You can play without watching an ad.
      - paragraph [ref=f1e25]: Google may process information such as your IP address and approximate general location, device or app identifiers, advertising interactions, product interactions, crash logs, and performance diagnostics. Google may use this information to provide and measure ads, prevent fraud, perform analytics, and improve its services. The information Google receives and how it uses that information are governed by Google’s policies.
      - paragraph [ref=f1e26]: Strikernaut does not currently request permission through Apple’s App Tracking Transparency prompt and does not receive your advertising identifier for cross-app tracking.
      - paragraph [ref=f1e27]:
        - text: Learn more in
        - link "Google’s Privacy Policy" [ref=f1e28] [cursor=pointer]:
          - /url: https://policies.google.com/privacy
        - text: and
        - link "How Google uses information from sites or apps that use its services" [ref=f1e29] [cursor=pointer]:
          - /url: https://policies.google.com/technologies/partner-sites
        - text: .
      - heading "Information we do not request" [level=2] [ref=f1e30]
      - paragraph [ref=f1e31]: Strikernaut does not require an account and does not ask you to provide your name, email address, phone number, contacts, photos, health data, precise location, or payment information. The developer does not run a separate analytics or advertising server for the app.
      - heading "Your choices" [level=2] [ref=f1e32]
      - list [ref=f1e33]:
        - listitem [ref=f1e34]: Decline every rewarded-ad offer and continue playing normally.
        - listitem [ref=f1e35]:
          - text: Use
          - strong [ref=f1e36]: Settings → Privacy Choices
          - text: when that option is required and made available by Google.
        - listitem [ref=f1e37]:
          - text: Use
          - strong [ref=f1e38]: Reset Account
          - text: to clear locally saved progress.
        - listitem [ref=f1e39]: Delete the app to remove its locally stored information.
        - listitem [ref=f1e40]: Manage applicable device privacy controls in iOS Settings.
      - heading "Children’s privacy" [level=2] [ref=f1e41]
      - paragraph [ref=f1e42]: Strikernaut does not knowingly ask children or adults to submit personal information to the developer. If you believe personal information was provided through a support request, contact us so the request can be reviewed and removed where appropriate.
      - heading "Data retention and security" [level=2] [ref=f1e43]
      - paragraph [ref=f1e44]: Local game data remains on the device until it is reset or the app is deleted. Data processed by Google is retained and protected according to Google’s policies. No method of electronic processing is completely secure, but we limit the app’s data handling to what is needed to provide its features.
      - heading "Changes to this policy" [level=2] [ref=f1e45]
      - paragraph [ref=f1e46]: This policy may be updated when Strikernaut’s features or service providers change. The effective date at the top of this page will be updated when material changes are published.
      - heading "Contact" [level=2] [ref=f1e47]
      - paragraph [ref=f1e48]:
        - text: For privacy questions, visit
        - link "Strikernaut Support" [ref=f1e49] [cursor=pointer]:
          - /url: /support/
        - text: . Please do not include sensitive personal information in a public GitHub issue.
